<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azka Printing - Pesanan</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <header id="header"></header>
  <main class="container">
    <h1>Daftar Pesanan</h1>
    <p class="sub">Pantau status pesanan cetak kamu.</p>

    <div class="stats" id="stats"></div>

    <div class="tools">
      <div class="chips" id="tabs"></div>
      <input id="q" class="search" placeholder="Cari no. order / nama...">
    </div>

    <div id="list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderHeader("pesanan");
    const STATUS = { menunggu_bayar: "Menunggu Bayar", diproduksi: "Diproduksi", dikirim: "Dikirim", selesai: "Selesai" };
    let orders = [], tab = "semua", q = "";

    const tgl = d => new Date(d).toLocaleString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });

    function sizeText(o) { return Object.entries(o || {}).map(([k, v]) => `${k}: ${v}`).join(" • "); }

    function draw() {
      const count = s => orders.filter(o => o.status === s).length;
      $("#stats").innerHTML = `
        <div class="card stat"><b>${orders.length}</b><span>Total pesanan</span></div>
        <div class="card stat"><b>${count("diproduksi")}</b><span>Sedang diproduksi</span></div>
        <div class="card stat"><b>${rupiah(orders.reduce((a, o) => a + o.total, 0))}</b><span>Total nilai pesanan</span></div>`;

      const tabs = [["semua", "Semua (" + orders.length + ")"], ...Object.entries(STATUS).map(([k, t]) => [k, `${t} (${count(k)})`])];
      $("#tabs").innerHTML = tabs.map(([k, t]) => `<button class="chip ${k === tab ? "on" : ""}" data-t="${k}">${t}</button>`).join("");

      const list = orders.filter(o => (tab === "semua" || o.status === tab) &&
        (o.order_no + " " + o.customer_name).toLowerCase().includes(q.toLowerCase()));

      $("#list").innerHTML = list.length ? list.map(o => `
        <div class="card order">
          <div class="ohead">
            <div><span class="ono">#${esc(o.order_no)}</span> <small class="sub">&nbsp;${tgl(o.created_at)} • ${esc(o.customer_name)}</small></div>
            <span class="badge s-${o.status}">${STATUS[o.status] || o.status}</span>
          </div>
          ${(o.order_items || []).map(i => `
            <div class="oitem">
              ${designThumb(i, i.category)}
              <div style="flex:1">
                <b>${esc(i.product_name)}</b><br>
                <small>${esc(i.method)} • ${esc(i.color || "-")} • ${sizeText(i.size_qty)}</small>
                ${i.design_text ? `<br><small>Teks: "${esc(i.design_text)}"</small>` : ""}
                ${designBadge(i)}
              </div>
              <b>${i.qty} pcs</b>
            </div>`).join("")}
          <div class="ofoot"><span>Total</span><span>${rupiah(o.total)}</span></div>
        </div>`).join("") : '<div class="empty">Belum ada pesanan. <a href="index.html" style="color:var(--primary);font-weight:700">Buat pesanan pertama</a></div>';
    }

    $("#tabs").addEventListener("click", e => { if (e.target.dataset.t) { tab = e.target.dataset.t; draw(); } });
    $("#q").addEventListener("input", e => { q = e.target.value; draw(); });

    DB.orders().then(r => {
      orders = r; draw();
      const baru = new URLSearchParams(location.search).get("baru");
      if (baru) toast("Pesanan #" + baru + " berhasil dibuat!");
    }).catch(err => { $("#list").innerHTML = `<div class="empty">Gagal memuat data: ${esc(err.message)}</div>`; });
  </script>
</body>
</html>
