<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Azka Printing - Admin</title>
  <link rel="icon" type="image/jpeg" href="assets/azka-printing-logo.jpeg">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <header id="header"></header>
  <main class="container admin-wrap" id="app"></main>
  <div class="modal-bg" id="modalBg"><div class="modal wide" id="modal"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const STATUS = { menunggu_bayar: "Menunggu Bayar", diproduksi: "Diproduksi", dikirim: "Dikirim", selesai: "Selesai" };
    const NEXT = { menunggu_bayar: ["diproduksi", "Konfirmasi Bayar"], diproduksi: ["dikirim", "Tandai Dikirim"], dikirim: ["selesai", "Tandai Selesai"] };
    const CATS = { kaos: "Kaos", hoodie: "Hoodie", mug: "Mug", totebag: "Totebag", akrilik: "Akrilik" };
    const PRESET = { Hitam: "#1f2937", Putih: "#f8fafc", Navy: "#1e3a8a", Merah: "#b91c1c", Abu: "#6b7280", Krem: "#e7dfd0", Hijau: "#166534" };
    let view = "pesanan", orders = [], products = [], tab = "semua", q = "", pq = "", F = null;
    const tgl = d => new Date(d).toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    const sizeText = o => Object.entries(o || {}).map(([k, v]) => `${k}: ${v}`).join(" • ");

    function header(on) {
      $("#header").innerHTML = `<div class="container admin-wrap adm-bar">
        <a class="logo" href="admin.html">
          <img class="logo-img" src="assets/azka-printing-logo.jpeg" alt="Logo" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'">
          <span class="logo-dot" style="display:none"></span>
          <span>Azka Printing</span>
        </a><span class="adm-tag">ADMIN</span>
        ${on ? `<nav><a href="#pesanan" class="${view === "pesanan" ? "on" : ""}">Pesanan</a><a href="#produk" class="${view === "produk" ? "on" : ""}">Produk</a></nav>` : ""}
        <span class="sp"></span>
        ${on ? `<a class="btn sm" href="index.html" target="_blank">Lihat Etalase</a>${DB.live ? '<button class="btn sm" data-act="logout">Keluar</button>' : ""}` : ""}</div>`;
    }

    function loginView() {
      header(false);
      $("#app").innerHTML = `<form class="card login" id="loginF"><h2>Masuk Admin</h2>
        <input class="input" id="em" type="email" placeholder="Email" required>
        <input class="input" id="pw" type="password" placeholder="Password" required>
        <button class="btn primary block">Masuk</button></form>`;
      $("#loginF").onsubmit = async e => {
        e.preventDefault();
        try { await DB.login($("#em").value, $("#pw").value); start(); } catch (err) { toast("Gagal masuk: " + err.message); }
      };
    }

    // ---------- PESANAN ----------
    function ordersHTML() {
      const cnt = s => orders.filter(o => o.status === s).length;
      const paid = orders.filter(o => o.status !== "menunggu_bayar").reduce((a, o) => a + o.total, 0);
      const list = orders.filter(o => (tab === "semua" || o.status === tab) && (o.order_no + " " + o.customer_name).toLowerCase().includes(q.toLowerCase()));
      return `<div class="stats4">
        <div class="card stat"><b>${cnt("menunggu_bayar")}</b><span>Menunggu bayar</span></div>
        <div class="card stat"><b>${cnt("diproduksi")}</b><span>Sedang diproduksi</span></div>
        <div class="card stat"><b>${cnt("dikirim")}</b><span>Dalam pengiriman</span></div>
        <div class="card stat"><b style="font-size:22px;padding:5px 0">${rupiah(paid)}</b><span>Pendapatan (sudah dibayar)</span></div></div>
      <div class="tools"><div class="chips">${[["semua", "Semua (" + orders.length + ")"], ...Object.entries(STATUS).map(([k, t]) => [k, `${t} (${cnt(k)})`])]
        .map(([k, t]) => `<button class="chip ${k === tab ? "on" : ""}" data-act="tab" data-v="${k}">${t}</button>`).join("")}</div>
        <input class="search" id="q" placeholder="Cari no. order / nama..." value="${esc(q)}"></div>
      ${list.length ? list.map(o => {
        let ph = String(o.customer_phone || "").replace(/\D/g, ""); if (ph.startsWith("0")) ph = "62" + ph.slice(1);
        const wa = `https://wa.me/${ph}?text=${encodeURIComponent(`Halo ${o.customer_name}, pesanan #${o.order_no} di Azka Printing berstatus: ${STATUS[o.status]}. Total ${rupiah(o.total)}.`)}`;
        const nx = NEXT[o.status];
        return `<div class="card order"><div class="ohead">
          <div><span class="ono">#${esc(o.order_no)}</span> <small class="sub">&nbsp;${tgl(o.created_at)} • ${esc(o.customer_name)} • ${esc(o.customer_phone)}</small></div>
          <span class="badge s-${o.status}">${STATUS[o.status] || o.status}</span></div>
          ${(o.order_items || []).map(i => `<div class="oitem">
            ${designThumb(i, i.category)}
            <div style="flex:1"><b>${esc(i.product_name)}</b><br><small>${esc(i.method)} • ${esc(i.color || "-")} • ${sizeText(i.size_qty)}</small>
              ${i.design_text ? `<br><small>Teks: "${esc(i.design_text)}"</small>` : ""}
              ${designLinks(i)}</div>
            <b>${i.qty} pcs</b></div>`).join("")}
          <div class="ofoot"><span>Total</span><span>${rupiah(o.total)}</span></div>
          <div class="ocard-act">
            ${nx ? `<button class="btn primary sm" data-act="status" data-id="${o.id}" data-v="${nx[0]}">${nx[1]}</button>` : ""}
            <select data-act="statusSel" data-id="${o.id}">${Object.entries(STATUS).map(([k, t]) => `<option value="${k}" ${k === o.status ? "selected" : ""}>${t}</option>`).join("")}</select>
            <a class="btn sm" href="${wa}" target="_blank">Hubungi via WhatsApp</a></div></div>`;
      }).join("") : '<div class="empty">Tidak ada pesanan.</div>'}`;
    }

    // ---------- PRODUK ----------
    function productsHTML() {
      const list = products.filter(p => (p.name + p.sku).toLowerCase().includes(pq.toLowerCase()));
      return `<div class="tools" style="margin-top:20px"><input class="search" id="pq" placeholder="Cari produk / SKU..." value="${esc(pq)}">
        <button class="btn primary" data-act="add">+ Tambah Produk</button></div>
        <div class="grid">${list.map(p => `<article class="pcard ${p.active === false ? "off" : ""}">
          <div class="pimg ${p.image_url ? "has-img" : ""}">${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : productSVG(p.category, p.colors[0]?.hex)}</div>
          <div class="pbody"><span class="pcat">${esc(p.category)} • ${esc(p.sku)}</span><div class="pname">${esc(p.name)}</div>
            <div class="dots">${p.colors.map(c => `<span class="dot" title="${esc(c.name)}" style="background:${c.hex}"></span>`).join("")}</div>
            <div class="pprice"><b>${rupiah(p.base_price)}</b><span class="badge ${p.active === false ? "s-menunggu_bayar" : "s-selesai"}">${p.active === false ? "Disembunyikan" : "Tampil"}</span></div>
            <div class="pa"><button class="btn sm" data-act="edit" data-id="${p.id}">Edit</button>
              <button class="btn sm" data-act="toggle" data-id="${p.id}">${p.active === false ? "Tampilkan" : "Sembunyikan"}</button>
              <button class="btn sm danger" data-act="del" data-id="${p.id}">Hapus</button></div></div></article>`).join("")}</div>
        ${list.length ? "" : '<div class="empty">Belum ada produk.</div>'}`;
    }

    function colorRows() {
      return F.colors.map((c, i) => `<div class="crow"><input type="color" value="${c.hex}" data-ci="${i}" data-k="hex">
        <input class="input" value="${esc(c.name)}" placeholder="Nama warna" data-ci="${i}" data-k="name">
        <button type="button" class="btn sm danger" data-act="delColor" data-i="${i}">✕</button></div>`).join("");
    }
    function openForm(p) {
      F = { id: p?.id, image: p?.image_url || null, blob: null, colors: structuredClone(p?.colors || [{ name: "Hitam", hex: "#1f2937" }]) };
      $("#modal").innerHTML = `<h2>${p ? "Edit Produk" : "Tambah Produk"}</h2><div class="fgrid">
        <div class="full"><label class="fl">Foto produk</label><div class="imgbox" id="imgbox"></div>
          <div class="pa"><input type="file" id="file" accept="image/*" hidden><button type="button" class="btn sm" data-act="pick">Pilih foto</button>
          <button type="button" class="btn sm danger" data-act="noimg">Hapus foto</button></div></div>
        <div class="full"><label class="fl">Nama produk</label><input class="input" id="f_name" value="${esc(p?.name || "")}"></div>
        <div><label class="fl">Kategori</label><select class="input" id="f_cat">${Object.entries(CATS).map(([k, t]) => `<option value="${k}" ${p?.category === k ? "selected" : ""}>${t}</option>`).join("")}</select></div>
        <div><label class="fl">Harga dasar (Rp / pcs)</label><input class="input" id="f_price" type="number" min="0" value="${p?.base_price ?? ""}"></div>
        <div><label class="fl">SKU (boleh kosong)</label><input class="input" id="f_sku" value="${esc(p?.sku || "")}"></div>
        <div style="display:flex;align-items:end"><label><input type="checkbox" id="f_sizes" ${p?.has_sizes === false ? "" : "checked"}> Pakai pilihan ukuran (S–3XL)</label></div>
        <div class="full"><label class="fl">Deskripsi</label><textarea class="input" id="f_desc" rows="3">${esc(p?.description || "")}</textarea></div>
        <div class="full"><label class="fl">Pilihan warna</label><div id="colors">${colorRows()}</div>
          <div class="pa">${Object.keys(PRESET).map(n => `<button type="button" class="chip" data-act="preset" data-v="${n}">+ ${n}</button>`).join("")}
          <button type="button" class="chip" data-act="addColor">+ Warna lain</button></div></div>
        <div class="full"><label><input type="checkbox" id="f_active" ${p?.active === false ? "" : "checked"}> Tampilkan di etalase</label></div></div>
        <div class="pa" style="justify-content:flex-end;margin-top:6px"><button class="btn" data-act="close">Batal</button><button class="btn primary" data-act="save">Simpan</button></div>`;
      paintImg(); $("#modalBg").classList.add("show");
    }
    const paintImg = () => $("#imgbox").innerHTML = F.image ? `<img src="${esc(F.image)}" alt="">` : "Belum ada foto (memakai gambar bawaan)";
    const closeForm = () => $("#modalBg").classList.remove("show");

    function shrink(file, max = 800) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => {
          const r = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
          c.width = img.width * r; c.height = img.height * r;
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(res, "image/jpeg", .85);
        };
        img.onerror = rej; img.src = URL.createObjectURL(file);
      });
    }

    async function saveForm(btn) {
      const name = $("#f_name").value.trim(), price = parseInt($("#f_price").value);
      const colors = F.colors.filter(c => c.name.trim());
      if (!name) return toast("Nama produk wajib diisi");
      if (isNaN(price) || price < 0) return toast("Harga tidak valid");
      if (!colors.length) return toast("Isi minimal satu warna");
      btn.disabled = true;
      try {
        const cat = $("#f_cat").value;
        let image_url = F.image;
        if (F.blob) image_url = await DB.uploadProductImage(F.blob);
        const row = { name, category: cat, base_price: price, description: $("#f_desc").value.trim(), has_sizes: $("#f_sizes").checked,
          colors, active: $("#f_active").checked, image_url,
          sku: $("#f_sku").value.trim() || "AZ-" + cat.slice(0, 2).toUpperCase() + "-" + Date.now().toString(36).toUpperCase() };
        if (F.id) row.id = F.id; else row.sort = Math.max(0, ...products.map(p => p.sort || 0)) + 1;
        await DB.saveProduct(row);
        closeForm(); toast("Produk disimpan"); await load(); render();
      } catch (err) { toast("Gagal menyimpan: " + err.message); btn.disabled = false; }
    }

    // ---------- UMUM ----------
    function render() { header(true); $("#app").innerHTML = view === "pesanan" ? ordersHTML() : productsHTML(); }
    async function load() { [orders, products] = await Promise.all([DB.orders(), DB.allProducts()]); }
    async function setStatus(id, v) {
      try { await DB.updateOrderStatus(id, v); orders.find(o => o.id === id).status = v; toast("Status diubah: " + STATUS[v]); }
      catch (err) { toast(err.message); } render();
    }

    document.addEventListener("click", async e => {
      const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
      const { act, id, v, i } = b.dataset, find = () => products.find(p => p.id === id);
      if (act === "tab") { tab = v; render(); }
      else if (act === "status") setStatus(id, v);
      else if (act === "logout") { await DB.logout(); loginView(); }
      else if (act === "add") openForm();
      else if (act === "edit") openForm(find());
      else if (act === "close") closeForm();
      else if (act === "save") saveForm(b);
      else if (act === "pick") $("#file").click();
      else if (act === "noimg") { F.image = null; F.blob = null; paintImg(); }
      else if (act === "preset") { F.colors.push({ name: v, hex: PRESET[v] }); $("#colors").innerHTML = colorRows(); }
      else if (act === "addColor") { F.colors.push({ name: "", hex: "#4338ca" }); $("#colors").innerHTML = colorRows(); }
      else if (act === "delColor") { F.colors.splice(+i, 1); $("#colors").innerHTML = colorRows(); }
      else if (act === "toggle") {
        try { await DB.saveProduct({ id, active: find().active === false }); await load(); } catch (err) { toast(err.message); } render();
      } else if (act === "del") {
        if (!confirm(`Hapus "${find().name}" permanen? Kalau sudah pernah dipesan, pakai "Sembunyikan" saja.`)) return;
        try { await DB.deleteProduct(id); toast("Produk dihapus"); await load(); }
        catch (err) { toast("Tidak bisa dihapus (mungkin sudah ada di pesanan). Gunakan Sembunyikan."); } render();
      }
    });
    document.addEventListener("change", async e => {
      const t = e.target;
      if (t.dataset.act === "statusSel") setStatus(t.dataset.id, t.value);
      else if (t.id === "file" && t.files[0]) {
        try { F.blob = await shrink(t.files[0]); F.image = URL.createObjectURL(F.blob); paintImg(); } catch { toast("File bukan gambar yang valid"); }
      }
    });
    document.addEventListener("input", e => {
      const t = e.target;
      if (t.id === "q") { q = t.value; const p = t.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); }
      else if (t.id === "pq") { pq = t.value; const p = t.selectionStart; render(); const n = $("#pq"); n.focus(); n.setSelectionRange(p, p); }
      else if (t.dataset.ci !== undefined) F.colors[+t.dataset.ci][t.dataset.k] = t.value;
    });
    $("#modalBg").addEventListener("click", e => { if (e.target.id === "modalBg") closeForm(); });
    window.addEventListener("hashchange", () => { view = location.hash === "#produk" ? "produk" : "pesanan"; if ($("#app .login") === null) render(); });

    async function start() {
      if (!(await DB.session())) return loginView();
      view = location.hash === "#produk" ? "produk" : "pesanan";
      try { await load(); render(); } catch (err) { $("#app").innerHTML = `<div class="empty">Gagal memuat data: ${esc(err.message)}</div>`; }
    }
    start();
  </script>
</body>
</html>
