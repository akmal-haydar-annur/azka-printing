<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azka Printing - Katalog</title>
  <link rel="icon" type="image/jpeg" href="assets/azka-printing-logo.jpeg">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <header id="header"></header>
  <main class="container">
    <section class="hero">
      <h1>Cetak Merchandise Komunitas & Distro</h1>
      <p>Bebas minimum order, bisa satuan. Diskon otomatis mulai 12 pcs. Pilih produk, upload desain, pesan.</p>
      <a class="btn" href="studio.html">Mulai Desain</a>
    </section>

    <div class="tools">
      <input id="q" class="search" placeholder="Cari produk...">
      <div class="chips" id="chips"></div>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderHeader("katalog");
    let products = [], cat = "semua", q = "";
    const CATS = { semua: "Semua", kaos: "Kaos", hoodie: "Hoodie", mug: "Mug", totebag: "Totebag", akrilik: "Akrilik" };

    function draw() {
      $("#chips").innerHTML = Object.entries(CATS).map(([k, t]) =>
        `<button class="chip ${k === cat ? "on" : ""}" data-c="${k}">${t}</button>`).join("");
      const list = products.filter(p =>
        (cat === "semua" || p.category === cat) && p.name.toLowerCase().includes(q.toLowerCase()));
      $("#grid").innerHTML = list.length ? list.map(p => `
        <article class="pcard">
          <div class="pimg ${p.image_url ? "has-img" : ""}">${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}">` : productSVG(p.category, p.colors[0]?.hex)}</div>
          <div class="pbody">
            <span class="pcat">${esc(p.category)}</span>
            <div class="pname">${esc(p.name)}</div>
            <div class="pdesc">${esc(p.description)}</div>
            <div class="dots">${p.colors.map(c => `<span class="dot" title="${esc(c.name)}" style="background:${c.hex}"></span>`).join("")}</div>
            <div class="pprice"><div><small>Mulai dari</small><br><b>${rupiah(p.base_price)}</b></div>
              <a class="btn primary" href="studio.html?product=${p.id}">Desain</a></div>
          </div>
        </article>`).join("") : '<div class="empty">Produk tidak ditemukan.</div>';
    }

    $("#chips").addEventListener("click", e => { if (e.target.dataset.c) { cat = e.target.dataset.c; draw(); } });
    $("#q").addEventListener("input", e => { q = e.target.value; draw(); });

    DB.products().then(r => { products = r; draw(); })
      .catch(err => { $("#grid").innerHTML = `<div class="empty">Gagal memuat data: ${esc(err.message)}</div>`; });
  </script>
</body>
</html>
